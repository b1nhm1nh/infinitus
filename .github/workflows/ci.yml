name: CI
# Build + test on every push/PR. Pattern borrowed from steipete/CodexBar's
# ci.yml (concurrency-cancel + SwiftPM cache keyed on Package.resolved),
# sized down for a single-platform menu bar app.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      - run: swift build
      - run: swift test
  # End-to-end + performance gate (#18): the debug app against the demo
  # engine, driven through infinitusctl; fails on a broken command, a
  # missing pop-out, or idle CPU / RSS over budget (tools/e2e.sh).
  e2e:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      # Plain `swift build`: with two --product flags SwiftPM builds only
      # the LAST one, so the app binary here was the stale one from the
      # first cached .build on every run (2026-09-03).
      - run: swift build
      - run: tools/e2e.sh
  # The Omarchy/Waybar face (packaging/omarchy): core + tray must keep
  # building on Linux. Same plain invocations — the manifest gates the
  # AppKit target off non-macOS hosts.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  # The phone app shares InfinitusCore, so a change green on the Mac can
  # still lean on an API iOS lacks (Foundation.Process in TeamGit, #60).
  # Simulator build only: no signing, no device, no test run.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: xcodegen generate
        working-directory: ios
      - run: >
          xcodebuild -quiet -project InfinitusMobile.xcodeproj -scheme InfinitusMobile
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.build/ios
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
  # The Windows face (windows/README.md): the headless daemon and the
  # tray over the same core. The manifest gates the Windows targets on
  # os(Windows) and vendors zlib there (upstream 1.3.1, deterministic
  # deflate — the team envelopes stay byte-identical cross-platform), so
  # no vcpkg and no INCLUDE/LIB env: once LIB is set, clang stops adding
  # the VC and SDK lib dirs of its own (msvcrt.lib went missing, #171).
  # Non-blocking until proven on real runners; verified on 6.3.3 locally
  # (windows/env.ps1) — the 6.1 toolchain cannot link the test bundle
  # here (the daemon's main collides with the XCTest runner's on PE,
  # duplicate `main`), 6.3.3 links it.
  windows:
    # windows-latest moved to Visual Studio 18, whose STL refuses the
    # older swift toolchains' clang (STL1000 "expected Clang 20 or
    # newer", #155) before any of our code compiles; 2022 still carries
    # VS 17.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      # One --product per invocation: with two, SwiftPM builds only the
      # last (2026-09-03).
      - run: swift build --product infinitus-win
      - run: swift build --product infinitus-tray-win
      - run: swift test
