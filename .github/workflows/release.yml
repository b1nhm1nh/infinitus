name: Release
# Tag push (v*) builds the app on the macOS 26 image (the glass chrome
# needs its SDK to compile) and publishes the zip on the release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./make-app.sh
      - name: Zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent Limitless.app "Limitless-${VERSION}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Limitless-${VERSION}.zip" \
            --title "Limitless $GITHUB_REF_NAME" --generate-notes
      # Auto-bump the tap cask (CodexBar-style release->tap dispatch, done
      # here with a repo-scoped deploy key instead of a PAT).
      - name: Bump Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "Limitless-${VERSION}.zip" | cut -d' ' -f1)
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:deathemperor/homebrew-tap.git tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/limitless.rb
          git -c user.name="limitless-release" \
              -c user.email="actions@github.com" \
              commit -am "limitless ${VERSION}"
          git push
