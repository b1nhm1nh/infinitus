name: Release
# Tag push (v*) builds the app on the macOS 26 image (the glass chrome
# needs its SDK to compile) and publishes the zip on the release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    env:
      # secrets can't be referenced in `if:` directly; job env is the
      # documented bridge (step-local env is invisible to its own `if`).
      DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      # Developer ID + notarization run only when the secrets exist
      # (docs/RELEASING.md); without them the build is ad-hoc signed as
      # before. Order matters: sign → notarize the app → staple the app →
      # THEN zip, because the staple lives on the .app, not the archive.
      - name: Import Developer ID certificate
        if: env.DEVID_P12 != ''
        env:
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" \
            -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build app bundle
        run: ./make-app.sh
      - name: Notarize and staple
        if: env.DEVID_P12 != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent Infinitus.app notarize.zip
          xcrun notarytool submit notarize.zip --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple Infinitus.app
          spctl --assess --type execute -vv Infinitus.app
      - name: Zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent Infinitus.app "Infinitus-${VERSION}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Infinitus-${VERSION}.zip" \
            --title "Infinitus $GITHUB_REF_NAME" --generate-notes
      # Auto-bump the tap cask (CodexBar-style release->tap dispatch, done
      # here with a repo-scoped deploy key instead of a PAT).
      - name: Bump Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "Infinitus-${VERSION}.zip" | cut -d' ' -f1)
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:deathemperor/homebrew-tap.git tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/infinitus.rb
          git -c user.name="infinitus-release" \
              -c user.email="actions@github.com" \
              commit -am "infinitus ${VERSION}"
          git push
