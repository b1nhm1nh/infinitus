name: Nightly
# Daily build of main published on the rolling "nightly" prerelease.
# The nightly cask is version :latest — update via `brew reinstall`.
on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = midnight GMT+7
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nightly:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./make-app.sh
      - name: Zip
        run: ditto -c -k --keepParent Limitless.app Limitless-nightly.zip
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin HEAD:refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly Limitless-nightly.zip --clobber
            gh release edit nightly \
              --title "Nightly $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))" \
              --prerelease
          else
            gh release create nightly Limitless-nightly.zip \
              --title "Nightly $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))" \
              --notes "Rolling build of main. brew reinstall limitless@nightly to update." \
              --prerelease
          fi
